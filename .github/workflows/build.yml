name: Build Windows EXE

on:
  push:
    branches:
      - "arena/3de63eca-ekzameny-v-institute-mvd"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer & portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build (electron-builder)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Release (app-latest)
        uses: ncipollo/release-action@v1
        with:
          tag: app-latest
          name: "Облачный планировщик экзаменов (latest)"
          allowUpdates: true
          removeArtifacts: true
          prerelease: false
          artifacts: "app/dist/ExamPlanner-Setup.exe,app/dist/ExamPlanner-Portable.exe"
