name: Сборка Windows-приложения

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Проверки ядра и интерфейса
        run: npm test

  build:
    name: Сборка .exe
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Штамп сборки (дата и коммит)
        shell: pwsh
        run: |
          # Дата и короткий коммит попадают в приложение, чтобы старую сборку
          # можно было отличить от новой прямо в «Настройках».
          $stamp = "${{ github.run_id }}-${{ github.sha }}"
          $short = "${{ github.sha }}".Substring(0,7)
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          node -e "const f='package.json';const p=require('./'+f);p.buildStamp='$date / '+process.argv[1];require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')" $short
          Get-Content package.json | Select-String buildStamp

      - name: Сборка установщика
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath build-nsis.log
          if ($LASTEXITCODE -ne 0) {
            "### Установщик не собрался" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build-nsis.log -Tail 80 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - name: Сборка портативной версии
        shell: pwsh
        run: |
          npx electron-builder --win portable --x64 --publish never 2>&1 | Tee-Object -FilePath build-portable.log
          if ($LASTEXITCODE -ne 0) {
            "### Портативная версия не собралась" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build-portable.log -Tail 80 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - name: Список собранных файлов
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Текст описания релиза
        shell: pwsh
        run: |
          # Номер сборки в описании — по нему приложение понимает, что вышло
          # обновление. Без него все сборки выглядят одинаково.
          $short = "${{ github.sha }}".Substring(0,7)
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $lines = @(
            "Готовое приложение для Windows 11 (x64).",
            "",
            "Сборка: $date / $short",
            "",
            "**Что скачать:**",
            "- ``CloudExamPlanner-1.0.0-x64.exe`` — установщик (ярлык в меню «Пуск» и на рабочем столе).",
            "- ``CloudExamPlanner-1.0.0-portable.exe`` — портативная версия, работает без установки.",
            "",
            "Приложение само проверяет обновления раз в минуту и сразу скачивает новую версию в фоне; спросит только перед установкой.",
            "**Ответы уже внутри:** семь дисциплин, 627 вопросов с ответами (административная деятельность полиции — 149, уголовное право — 117, уголовно-процессуальное право — 108, тактико-специальная подготовка — 87, трудовое право — 70, гражданское процессуальное право — 52, криминалистика — 44). Добавлять ничего не нужно — откройте «Дисциплины».",
            "По административной деятельности ответов два: подробный (316 тыс. слов) и краткий (148 тыс.) — оба уже в программе. Порядок такой: сначала подробный файл целиком один раз, потом краткий один раз, и второй раз по краткому — только если останется время (этот проход стоит в конце дня и снимается, если день и без него полный).",
            "Свои файлы тоже можно добавить: TXT, DOCX, PDF, ODT, RTF.",
            "",
            "**Даты уже стоят.** 18 декабря — трудовое право (зачёт), 24 декабря — гражданский процесс (зачёт), 26 декабря — криминалистика (зачёт), 30 декабря — тактико-специальная подготовка (зачёт), 12 января — уголовный процесс (экзамен), 15 января — уголовное право (экзамен), 19 января — административная деятельность (экзамен). Дату у каждой дисциплины можно поменять.",
            "**Три экрана.** «Сегодня» — что читать и что уже отмечено; «Дисциплины» — дата экзамена, вопросы и одно число: сколько часов в день вы готовы читать; «Настройки» — скорость чтения, оформление, данные.",
            "План строится ровно: одна и та же нагрузка каждый день, ничего не сваливается в последний день. Прочитали больше нормы — следующие дни станут легче (кнопка «Взять вперёд»).",
            "Отметку можно снять в любой момент: в списке «Уже отмечено», а после «Отметить всё» — кнопкой «Отменить» в плашке."
          )
          $lines -join "`n" | Out-File -FilePath ../release-body.md -Encoding utf8

      - name: Загрузить .exe в релиз
        uses: ncipollo/release-action@v1
        with:
          tag: app-latest
          name: Облачный планировщик экзаменов — последняя сборка
          bodyFile: release-body.md
          artifacts: "app/dist/*.exe"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          omitNameDuringUpdate: true
          # Этот релиз должен быть главным: иначе GitHub показывает первым
          # старую сборку с другой ветки, и легко скачать не то.
          makeLatest: true

      - name: Сохранить сборку в артефактах
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            app/dist/*.exe
            app/build-*.log
          retention-days: 14
