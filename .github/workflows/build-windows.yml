name: Сборка Windows-приложения

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Проверки ядра и интерфейса
        run: npm test

  build:
    name: Сборка .exe
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Сборка установщика и portable-версии
        shell: pwsh
        run: |
          $attempts = 2
          $ok = $false
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "=== Попытка $attempt из $attempts ==="
            $env:DEBUG = "electron-builder"
            npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Сборка не удалась, код $LASTEXITCODE"
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            # Причина должна быть видна прямо в аннотациях запуска.
            $lines = Get-Content build.log -ErrorAction SilentlyContinue
            Write-Host "Строк в логе: $($lines.Count)"
            $tail = $lines | Select-Object -Last 60
            foreach ($line in $tail) {
              $clean = $line -replace "%", "%25" -replace "\r", "" -replace "\n", " "
              if ($clean.Trim().Length -gt 0) { Write-Host "::error::$clean" }
            }
            Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object Name, Length
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - name: Список собранных файлов
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Загрузить .exe в релиз
        uses: ncipollo/release-action@v1
        with:
          tag: app-latest
          name: Облачный планировщик экзаменов — последняя сборка
          body: |
            Готовое приложение для Windows 11 (x64).

            **Что скачать:**
            - `CloudExamPlanner-1.0.0-x64.exe` — установщик (ярлык в меню «Пуск» и на рабочем столе).
            - `CloudExamPlanner-1.0.0-portable.exe` — портативная версия, работает без установки.

            Файлы с вопросами и ответами в сборку не входят — добавьте их в программе
            кнопкой «Добавить файл» или перетаскиванием в окно.
          artifacts: "app/dist/*.exe"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

      - name: Сохранить сборку в артефактах
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            app/dist/*.exe
            app/build.log
          retention-days: 14
