# Загрузка источников в репозиторий.
# Запускается при изменении списка заданий .github/downloader/tasks.tsv.
# Скачанные файлы и журнал загрузки сохраняются коммитом в ту же ветку.
name: download-sources
on:
  push:
    branches: ['arena/**']
    paths: ['.github/downloader/tasks.tsv']
permissions:
  contents: write
concurrency:
  group: download-sources
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Скачать
        run: python3 .github/downloader/fetch.py .github/downloader/tasks.tsv
      - name: Сохранить в ветку
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Загрузка источников (автоматически)" || exit 0
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
