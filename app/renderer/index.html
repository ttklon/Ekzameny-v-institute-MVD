<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Облачный планировщик экзаменов</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Живое небо: рисуется в sky.js -->
    <canvas id="sky"></canvas>
    <div id="sky-veil"></div>

    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.3 9.2A3.9 3.9 0 0 0 6.8 19h10.7Z" />
              <path d="M9 14.5h6" />
              <path d="M12 11.5v6" />
            </svg>
          </div>
          <div class="brand-text">
            <div class="brand-title">Облачный</div>
            <div class="brand-sub">планировщик</div>
          </div>
        </div>

        <nav id="nav"></nav>

        <div class="sidebar-foot">
          <div class="sidebar-foot-head">
            <span class="sidebar-foot-label">Готовность</span>
            <span class="sidebar-foot-value" id="sideValue">0%</span>
          </div>
          <div class="mini-bar"><i id="sideBar"></i></div>
          <div class="sidebar-foot-sub" id="sideSub">нет дисциплин</div>
        </div>
      </aside>

      <main id="main">
        <header id="topbar">
          <div class="topbar-left">
            <h1 id="viewTitle">Обзор</h1>
            <div id="viewSub" class="view-sub"></div>
          </div>
          <div class="topbar-right">
            <div class="today-pill">
              <span class="dot"></span>
              <span id="todayPill">—</span>
            </div>
            <button class="icon-btn" id="soundBtn" title="Звук интерфейса" aria-label="Звук интерфейса"></button>
            <button class="icon-btn" id="importBtn" title="Добавить файлы (Ctrl+O)" aria-label="Добавить файлы"></button>
          </div>
        </header>

        <section id="view" class="view" aria-live="polite"></section>
      </main>
    </div>

    <!-- Перетаскивание файлов поверх всего окна -->
    <div id="dropzone">
      <div class="drop-inner">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4m0 0 4 4m-4-4-4 4" />
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
        </div>
        <h3>Отпустите файлы здесь</h3>
        <p>TXT, DOCX, PDF, ODT, RTF — программа сама найдёт вопросы и ответы</p>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="modal-root"></div>

    <script src="../src/core/text.js"></script>
    <script src="../src/core/parser.js"></script>
    <script src="../src/core/planner.js"></script>
    <script src="js/sky.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
