<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Облачный планировщик экзаменов</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Живое небо с облаками -->
    <canvas id="sky"></canvas>
    <div id="sun"></div>
    <div id="aurora"></div>

    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <div class="brand-logo">☁️</div>
          <div class="brand-text">
            <div class="brand-title">Облачный</div>
            <div class="brand-sub">планировщик экзаменов</div>
          </div>
        </div>
        <nav id="nav">
          <button class="nav-item active" data-view="dashboard"><span class="ni">🌤️</span><span>Обзор</span></button>
          <button class="nav-item" data-view="import"><span class="ni">📥</span><span>Импорт</span></button>
          <button class="nav-item" data-view="disciplines"><span class="ni">📚</span><span>Дисциплины</span></button>
          <button class="nav-item" data-view="today"><span class="ni">✅</span><span>Сегодня</span></button>
          <button class="nav-item" data-view="stats"><span class="ni">📊</span><span>Статистика</span></button>
          <button class="nav-item" data-view="tips"><span class="ni">💡</span><span>Советы</span></button>
          <button class="nav-item" data-view="settings"><span class="ni">⚙️</span><span>Настройки</span></button>
        </nav>
        <div class="sidebar-foot">
          <div class="mini-ring" id="sideRing">
            <svg viewBox="0 0 40 40">
              <circle class="r-bg" cx="20" cy="20" r="16"></circle>
              <circle class="r-fg" cx="20" cy="20" r="16"></circle>
            </svg>
            <div class="mini-ring-label" id="sideRingLabel">0%</div>
          </div>
          <div class="sidebar-foot-text">общий прогресс</div>
        </div>
      </aside>

      <main id="main">
        <header id="topbar">
          <div class="topbar-left">
            <h1 id="viewTitle">Обзор</h1>
            <div id="viewSub" class="view-sub"></div>
          </div>
          <div class="topbar-right">
            <div class="today-pill" id="todayPill">Сегодня</div>
            <button class="ghost-btn" id="soundBtn" title="Звук">🔊</button>
          </div>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../src/core/textstats.js"></script>
    <script src="../src/core/parser.js"></script>
    <script src="../src/core/planner.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/clouds.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
