        <script>
		REQ = parseRequest(window.location.hash.substring(1));
		if (MODE_EDIT && REQ.mode=='content') {//режим редактирования
				VIEWMODE_MARKS_EDIT = {
					actual: 1,
					future: 1, 		
					comment: 1,			
					links: 0,			
					currred: 1,					
				};
				VIEWMODE_MARKS.actual.value = 1;
				VIEWMODE_MARKS.future.value = 1;
				VIEWMODE_MARKS.comment.value = 1;
				VIEWMODE_MARKS.links.value = 0;
				//VIEWMODE_MARKS.currred.value = 1;
				
				//Блокировка акта	
				if ('userid' in REQ)
					$.post(HTTP_HOST + 'doclock', {
							bpa: REQ.bpa,
							hash: REQ.hash,
							userid: REQ.userid
						}).done(function(data) {
							if (data.result){//документ свободен, блокируется для других пользователей								
								$('.text-only').attr('lockkey', data.lockkey)								
							}
							else{//документ заблокирован других пользователем
								$('.text-only').addClass('doc-locked');
								showDialog('Документ занят, сохранение оглавления не доступно. ' + data.message, 'error')
							}	
						}).fail(function(data){
							showDialog(data.Message)
						})
				else
					showDialog('Пользователь не авторизован, сохранение оглавления не доступно.', 'error')
				
		}
		$(function() {			
			if (MODE_EDIT && REQ.mode=='content') {//режим редактирования
				let scriptEl = document.createElement("script");
				scriptEl.setAttribute("src", "../edit/content-edit.js");
				$('body').prepend(scriptEl);

				$('body').addClass('edit-contents');
				$('.icon-download02').addClass('hidden');
				$('.icon-print').addClass('hidden');
				$('.control-view-icons .control-info').addClass('hidden');
				
				FOOTER = [];
				FOOTER_OPENED = 0;

				$frame[0].id = 'editcontent';
				
				//справка
				$('#help-modal iframe').attr('src','../edit/editcontent.html')				
			}
			$(".row.main-row").clone($(".splitted-divs"));		
		});
			
//$(".view-col-contaner").load("textdiv.html");
		$(".view-col-contaner").load("textdiv.html", function() {
			let scriptEl = document.createElement("script");
				scriptEl.setAttribute("src", "../js/ips.js");
				$('body').prepend(scriptEl);
		});					
		</script>
